[project]
name = "k8s-docs-rag"
version = "0.1.0"
description = "Kubernetes docs Q&A with citations, version awareness, and an eval pipeline"
requires-python = ">=3.14,<3.15"
dependencies = [
    "anthropic>=1.8.0",
    "fastapi>=0.141.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.53.0",
    "voyageai>=0.5.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
local = [
    "sentence-transformers>=5",
    "torch>=2.9",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
